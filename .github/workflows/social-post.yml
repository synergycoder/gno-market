name: Social media auto-post

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install headless browser
        run: npx playwright install --with-deps chromium

      - name: Run poster
        run: node scripts/social-poster.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Commit queue updates
        run: |
          git config user.name "anonymous"
          git config user.email "anonymous@users.noreply.github.com"
          git add social-queue.json
          if git diff --cached --quiet; then
            echo "No queue changes, nothing to commit."
          else
            git commit -m "Update social post queue [skip ci]"
            git push
          fi
