name: Update chain data cache

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  # A stuck run used to block every subsequent scheduled trigger for its
  # entire duration instead of just delaying by one 30-min cycle — with
  # no timeout-minutes below either, that meant hours of stale data
  # (observed live: multiple runs auto-cancelled by GitHub's 6-hour job
  # ceiling, and every scheduled run in between queuing uselessly behind
  # the stuck one instead of just superseding it). A fresh run now
  # cancels whatever's still running instead of waiting on it.
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Real runs typically finish in 1-2 minutes, but the old 25-min value
    # here was set from an INCOMPLETE accounting — it only budgeted for
    # fetchWhaleWatch's own 8-min soft deadline (see build-cache.mjs) and
    # missed that fetchSapphireRush's position-scan loop and
    # fetchNftCollectionImages were BOTH still genuinely unbounded at the
    # time. Confirmed live: real runs started hitting this ceiling for
    # real (not a hypothetical) once chain activity grew enough — every
    # scheduled run for ~19 hours straight got force-cancelled mid-run,
    # meaning the commit step never ran and data/ went stale despite the
    # UI's own "updates every 30 min" claim. Both loops now have their
    # own soft deadlines too (3 min for nft images, 8 min for the
    # position scan), so the real worst case per network is now whale
    # watch (8) + sapphire-only rush (its own xGNS holders fetch, capped
    # 4, + the position scan, capped 8) + nft images (3) + token holders
    # (4, fetchInChunks' own default) + fast misc steps (~1) ≈ 28 min for
    # sapphire alone, plus betanet/testnet's own smaller runs after it
    # (no sapphire-rush step, so ~16 min worst case each) — 40 gives that
    # real headroom instead of just delaying the same cancellation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cache build
        run: node scripts/build-cache.mjs

      - name: Commit and push if changed
        # Runs even if the build step above failed (e.g. one network's
        # indexer query hung) — that network's data just doesn't update
        # this cycle, but the other network's already-computed, already-
        # written file still gets committed rather than being discarded.
        # The job as a whole still reports failed, for visibility.
        if: always()
        run: |
          git config user.name "anonymous"
          git config user.email "anonymous@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "Update chain data cache [skip ci]"
            git push
          fi
